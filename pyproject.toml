[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftless-playwright"
version = "0.1.0"
description = "Deterministic-first, self-healing browser execution runtime on Playwright with closed-loop experience distillation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Driftless-Playwright Team" }
]
dependencies = [
    "playwright>=1.40.0",
    "openai>=1.12.0",
    "instructor>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pillow>=10.2.0",
    "imagehash>=4.3.1",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
